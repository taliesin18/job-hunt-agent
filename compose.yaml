services:
  job-hunt-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Ollama remains on the Windows host in this first containerized setup.
      # Override this in .env if Ollama later runs in another container or host.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      # Keep private career data and generated materials on the host, outside
      # the image, so rebuilding containers never deletes them.
      - ./data:/app/data
      - ./index:/app/index
      - ./out:/app/out
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      job-hunt-api:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
