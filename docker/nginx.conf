server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index job-hunt-frontend.html;

    location = / {
        try_files /job-hunt-frontend.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Keep the API private to the Compose network. The browser uses this
    # same-origin proxy instead of needing a host port for the API itself.
    location /api/ {
        proxy_pass http://job-hunt-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
