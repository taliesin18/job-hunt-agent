server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index job-hunt-frontend.html;

    location = / {
        try_files /job-hunt-frontend.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Keep the API private to the Compose network. The browser uses this
    # same-origin proxy instead of needing a host port for the API itself.
    location /api/ {
        proxy_pass http://job-hunt-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A local Ollama match can take several minutes on CPU or modest GPU
        # hardware. Keep this proxy aligned with the application's 300-second
        # generation timeout, with a small buffer so Nginx doesn't replace a
        # useful API error with its generic 504 page after the default 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
    }
}
